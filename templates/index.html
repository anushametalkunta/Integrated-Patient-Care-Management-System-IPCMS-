{% extends 'base_auth.html' %}
{% block title %}Welcome{% endblock %}
{% block content %}
<div class="auth-card" style="max-width:560px;margin:0 auto;text-align:center;">
    <div style="font-size:2.5rem;">❤️</div>
    <h1 style="margin:0.5rem 0;">IPCMS</h1>
    <p class="subtitle">Integrated Patient Care Management System</p>
    <p style="color:#64748b;font-size:0.9rem;">Milestone 1 + 2 — Patients, Appointments, EHR, Consultations, Prescriptions & Lab Reports</p>
    <div style="margin-top:1.5rem;display:flex;gap:0.75rem;justify-content:center;flex-wrap:wrap;">
        <a class="btn btn-primary" href="{{ url_for('auth.login') }}">Login</a>
        <a class="btn btn-outline" href="{{ url_for('auth.register') }}">Register</a>
    </div>
</div>
{% endblock %}
