{% extends 'base.html' %}
{% block title %}{{ title }}{% endblock %}
{% block page_name %}Pharmacy{% endblock %}
{% block content %}
<div class="page-header"><h1>{{ title }}</h1></div>

<form method="POST" class="form-card">
    <div class="form-group">
        <label>Medicine Name *</label>
        <input type="text" name="name" required value="{{ medicine.name if medicine else '' }}">
    </div>
    <div class="form-group">
        <label>Category</label>
        <input type="text" name="category" placeholder="e.g. Tablet, Syrup, Capsule" value="{{ medicine.category if medicine else '' }}">
    </div>
    <div class="form-group">
        <label>Manufacturer</label>
        <input type="text" name="manufacturer" value="{{ medicine.manufacturer if medicine else '' }}">
    </div>
    <div class="form-group">
        <label>Stock Quantity</label>
        <input type="number" name="stock" min="0" value="{{ medicine.stock if medicine else 0 }}">
    </div>
    <div class="form-group">
        <label>Unit Price (₹)</label>
        <input type="number" step="0.01" name="unit_price" min="0" value="{{ medicine.unit_price if medicine else 0 }}">
    </div>
    <div class="form-group">
        <label>Expiry Date</label>
        <input type="date" name="expiry_date" value="{{ medicine.expiry_date if medicine else '' }}">
    </div>
    <div class="form-actions">
        <button class="btn btn-primary" type="submit">Save Medicine</button>
        <a class="btn btn-outline" href="{{ url_for('pharmacy.index') }}">Cancel</a>
    </div>
</form>
{% endblock %}
