{% extends 'base.html' %}
{% block title %}Submit Feedback{% endblock %}
{% block page_name %}Submit Feedback{% endblock %}
{% block content %}
<div class="page-header">
    <h1>Share Your Feedback</h1>
</div>

<div class="card" style="max-width:600px;">
    <p class="muted">
        Consultation with Dr. {{ consultation.doctor.full_name }} on {{ consultation.consultation_date }}
    </p>

    <form method="POST">
        <div style="margin-bottom:16px;">
            <label>Rate the Doctor (1-5)</label><br>
            <select name="doctor_rating" required>
                <option value="">Select rating</option>
                {% for i in range(1, 6) %}<option value="{{ i }}">{{ i }} star{{ 's' if i != 1 }}</option>{% endfor %}
            </select>
        </div>
        <div style="margin-bottom:16px;">
            <label>Rate Hospital Services (1-5)</label><br>
            <select name="hospital_rating" required>
                <option value="">Select rating</option>
                {% for i in range(1, 6) %}<option value="{{ i }}">{{ i }} star{{ 's' if i != 1 }}</option>{% endfor %}
            </select>
        </div>
        <div style="margin-bottom:16px;">
            <label>Rate Laboratory Services (1-5)</label><br>
            <select name="lab_rating" required>
                <option value="">Select rating</option>
                {% for i in range(1, 6) %}<option value="{{ i }}">{{ i }} star{{ 's' if i != 1 }}</option>{% endfor %}
            </select>
        </div>
        <div style="margin-bottom:16px;">
            <label>Rate Pharmacy Services (1-5)</label><br>
            <select name="pharmacy_rating" required>
                <option value="">Select rating</option>
                {% for i in range(1, 6) %}<option value="{{ i }}">{{ i }} star{{ 's' if i != 1 }}</option>{% endfor %}
            </select>
        </div>
        <div style="margin-bottom:16px;">
            <label>Comments & Suggestions (optional)</label><br>
            <textarea name="comments" rows="4" style="width:100%;" placeholder="Tell us more..."></textarea>
        </div>
        <button class="btn btn-primary" type="submit">Submit Feedback</button>
    </form>
</div>
{% endblock %}
